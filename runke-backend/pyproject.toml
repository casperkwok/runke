[project]
name = "runke-backend"
version = "0.1.0"
description = "Runke 智能体平台统一后端 (FastAPI + PostgreSQL + LangGraph + LlamaIndex)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.2",
    "bcrypt>=4.2",
    "langchain-community>=0.4.2",
    "pypdf>=6.13.0",
    "docx2txt>=0.9",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "python-multipart>=0.0.32",
    "baseopensdk",
]

# 分阶段引入，保持 P0 安装轻量。后续阶段：uv sync --extra agents --extra rag
[project.optional-dependencies]
agents = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain>=1.0",
]
rag = [
    "fastembed>=0.4",
    "llama-index>=0.12",
    "llama-index-core>=0.12",
    "llama-index-embeddings-fastembed>=0.3",
    "llama-index-vector-stores-postgres>=0.3",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
baseopensdk = { url = "https://lf3-static.bytednsdoc.com/obj/eden-cn/lmeh7phbozvhoz/base-open-sdk/baseopensdk-0.0.13-py3-none-any.whl" }
